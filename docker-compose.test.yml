services:
  postgres:
    build:
      context: .
      dockerfile: tests/fixtures/postgres.Dockerfile
    environment:
      POSTGRES_DB: docraider-mcp
      POSTGRES_USER: docraider-mcp_user
      POSTGRES_PASSWORD: hogehoge
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docraider-mcp_user -d docraider-mcp"]
      interval: 2s
      timeout: 2s
      retries: 30

  embedding:
    image: node:22-alpine
    working_dir: /app
    command: ["node", "tests/fixtures/embedding-server.mjs"]
    environment:
      EMBEDDING_DIMENSIONS: 1536
    volumes:
      - .:/app:ro
    ports:
      - "11435:11434"
